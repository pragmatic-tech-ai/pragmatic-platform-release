# Publishes a platform release from a `release/X.Y.Z` (stable) or `release/X.Y.Z-early.N` (early access) tag of this
# repository. Nothing is built here: each of the nine container repositories released its image (tag v<version>,
# pushed by digest, component.json + digest.txt on its GitHub release); release.json names the nine images by digest.
# Both jobs check out the commit the tag named when the run started (github.sha), so publish signs what verify checked
# even if the tag moves meanwhile. Job `verify` (no secret but PACKAGES_TOKEN): install with no install scripts, typecheck, tests, and
# tools/bin/release-manifest.ts verify, which stops the run unless the tagged commit has a valid release.json naming the
# tag's version. Job `chart` (packages: write, no signing key): tools/bin/chart-build.ts builds the release's
# pragmatic-engine chart (release.json's image digests, the components' descriptors) and pushes it to
# oci://ghcr.io/pragmatic-tech-ai/charts/pragmatic-engine:<version>, answering its digest (refused for a version already
# published: its signed descriptor binds the chart pushed then). Job `publish` (environment
# `release`, the only holder of RELEASE_SIGNING_KEY):
# a production install (the toolkit's plain dist JS, no install scripts), then the toolkit's `pragmatic-release-publish
# assemble` (every image at its digest and labelled with the digest of its repository's v<version> component.json, the
# tag v<version> present, the image tag release-<version> free or the same digest, the version unpublished), then
# `publish --manifest --chart-digest`: the schema-3 descriptor (the chart's digest, the manifest's digests, the labelled component digests, each container
# repository's tag commit as siblingCommits, this commit as serverCommit) signed with the key and checked against
# release-keys/release-2026-11.pub.pem before any push, every image tagged release-<version>, the nine component.json
# assets (the descriptors the images carry, read from the container releases as for assemble) pushed as
# pragmatic-release:components-<version> (one layer per app; consoles validate configurations against them, checked
# against the signed component digests), and the descriptor pushed last as
# ghcr.io/pragmatic-tech-ai/pragmatic-release:<version> (a stopped publish is re-run as is).
# Registry: the nine image packages and pragmatic-release are public, so reads need no grant; writes (the release-<version>
# tags, the descriptor) go to packages created by pragmatic-server and linked to it, so this repository's GITHUB_TOKEN
# gets 403 until each of the ten packages grants pragmatic-platform-release Actions access with the Write role (package
# settings, "Manage Actions access"). GHCR_TOKEN (optional secret, write:packages) overrides the token for the publish
# step; without it the run uses its own GITHUB_TOKEN (username: the actor either way). The GitHub releases and tags of
# the container repositories (public) are read with GITHUB_TOKEN.
# Secrets: PACKAGES_TOKEN (read:packages, only for the install steps, through the repository's .npmrc),
# RELEASE_SIGNING_KEY (the Ed25519 private key PEM; an environment secret of `release` only, no repository copy, so only
# the publish job can read it; this is the only workflow of the organisation's new repositories that reads it, held by
# tools/tests), GHCR_TOKEN (optional). None is echoed or put on
# a command line; the key is written to a file under umask 077 and removed whatever the outcome.
name: release
on:
  push:
    tags: ['release/*']
permissions:
  contents: read
# One release run at a time across all release tags: two runs must never publish (or re-tag images) at once. GitHub keeps
# one run pending behind the running one and cancels an older pending run when a third tag arrives: push the next
# release tag after the previous run finished; a cancelled pending run is re-run by hand.
concurrency:
  group: platform-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      # Refuses a commit without a valid release.json, a manifest breaking this repository's policy, or a tag that is
      # not release/<the manifest version>.
      - name: Verify release.json against the tag
        run: npx --no-install tsx tools/bin/release-manifest.ts verify --manifest release.json --tag "$GITHUB_REF"
  chart:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Log helm in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
      # The chart at the release's digests and descriptors, pushed before the descriptor that binds its digest is signed.
      - name: Build and push the engine chart
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          RELEASE_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          npx --no-install tsx tools/bin/chart-build.ts --manifest release.json --out "$RUNNER_TEMP/chart" --push | tee "$RUNNER_TEMP/chart.out"
          grep '^digest=sha256:' "$RUNNER_TEMP/chart.out" >> "$GITHUB_OUTPUT"
      - name: Log helm out
        if: always()
        run: helm registry logout ghcr.io || true
  publish:
    needs: [verify, chart]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the release toolkit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Assemble (check only)
        env:
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          RELEASE_REGISTRY_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no-install pragmatic-release-publish assemble --manifest release.json
      - name: Write the release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo '::error::RELEASE_SIGNING_KEY is empty (the publish job reads it from the environment release)'
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
      - name: Sign and publish the release descriptor
        env:
          RELEASE_SIGNING_KEY_FILE: ${{ runner.temp }}/release.key
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          RELEASE_REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: npx --no-install pragmatic-release-publish publish --manifest release.json --key-id release-2026-11 --trust-dir release-keys --chart-digest "$CHART_DIGEST"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.key"
