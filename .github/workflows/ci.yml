# pragmatic-platform-release CI: install from the lock with no install scripts (every @pragmatic-tech-ai package from
# GitHub Packages with PACKAGES_TOKEN, through the repository's .npmrc, only in the install step), typecheck, tests,
# then the release manifest check (tools/bin/release-manifest.ts ci): no release.json passes; a release.json whose
# version is published must name exactly the published descriptor's image digests; otherwise it is assembled by the toolkit
# (`pragmatic-release-publish assemble`: every image at its digest, labelled with the digest of its repository's
# v<version> component.json, the tag present), so a release tag is only cut on a manifest CI has assembled. Read-only:
# nothing is signed or pushed here, and the release signing key is never read (release.yml only).
# Only a pull request from a fork (which gets no secrets) skips, with a warning; a missing PACKAGES_TOKEN anywhere else
# fails the run.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request cancels the older run; every push to main finishes (a release tag needs its check).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: PACKAGES_TOKEN present
        id: token
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$PACKAGES_TOKEN" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ "$FORK_PULL_REQUEST" = true ]; then
            echo '::warning::a pull request from a fork gets no PACKAGES_TOKEN: install, tests and the manifest check are skipped'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::PACKAGES_TOKEN is empty'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: '22'
      - name: Install
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and test
        if: steps.token.outputs.present == 'true'
        run: |
          npm run typecheck
          npm test
      - name: Check release.json
        if: steps.token.outputs.present == 'true'
        env:
          RELEASE_REGISTRY_USER: ${{ github.actor }}
          RELEASE_REGISTRY_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no-install tsx tools/bin/release-manifest.ts ci --manifest release.json
