# Source: pragmatic-engine/templates/hive-agent-networkpolicy.yaml
# Only the engine's console reaches the agent's internal enrolment API (C3.3); nothing else reaches the agent at all.
# The agent also checks each caller's token (TokenReview: audience pragmatic-hive-agent, the console's account).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pragmatic-hive-acme-hive-agent
  namespace: pragmatic-system
  labels:
    pragmatic/hive: acme-hive
spec:
  podSelector:
    matchLabels:
      pragmatic/app: pragmatic-hive-acme-hive-agent
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pragmatic-tenant-admin
      ports:
        - protocol: TCP
          port: 7210
---
# Source: pragmatic-engine/templates/postgres-statefulset.yaml
# Only the console, the realm sign-in service and this hive's environments reach Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pragmatic-postgres
  namespace: pragmatic-system
  labels:
    pragmatic/hive: acme-hive
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pragmatic-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              pragmatic/app: pragmatic-tenant-admin-acme
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pragmatic-idp-acme
          podSelector:
            matchLabels:
              pragmatic/app: pragmatic-idp-acme
        - namespaceSelector:
            matchLabels:
              pragmatic/hive: acme-hive
            matchExpressions:
              - { key: pragmatic/environment, operator: Exists }
      ports:
        - protocol: TCP
          port: 5432
---
# Source: pragmatic-engine/templates/tenant-admin-deployment.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pragmatic-tenant-admin-acme
  namespace: pragmatic-system
  labels:
    pragmatic/hive: acme-hive
spec:
  podSelector:
    matchLabels:
      pragmatic/app: pragmatic-tenant-admin-acme
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 7100
    # Only the hive agent reaches the internal intent endpoint (it also presents its token, checked by TokenReview).
    - from:
        - podSelector:
            matchLabels:
              pragmatic/app: pragmatic-hive-acme-hive-agent
      ports:
        - protocol: TCP
          port: 7211
---
# Source: pragmatic-engine/templates/tenant-idp-deployment.yaml
# The sign-in service trusts the forwarded client address, so only the ingress controller, the console and this hive's
# environments (their servers federate with it over its internal URL) may reach it; no other pod can forge that address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pragmatic-idp-acme
  namespace: pragmatic-idp-acme
  labels:
    pragmatic/hive: acme-hive
spec:
  podSelector:
    matchLabels:
      pragmatic/app: pragmatic-idp-acme
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pragmatic-system
          podSelector:
            matchLabels:
              pragmatic/app: pragmatic-tenant-admin-acme
        - namespaceSelector:
            matchLabels:
              pragmatic/hive: acme-hive
            matchExpressions:
              - { key: pragmatic/environment, operator: Exists }
      ports:
        - protocol: TCP
          port: 9443
