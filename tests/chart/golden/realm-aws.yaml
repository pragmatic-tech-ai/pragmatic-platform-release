# components by name, and reads the TLS Secret it copies into environments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragmatic-tenant-admin-acme
  labels:
    pragmatic/hive: acme-hive
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["pragmatic-tenant-admin-acme-env"]
    verbs: ["bind"]
  # The hive agent's bearer on the internal intent endpoint (C3.4): audience pragmatic-tenant-admin, the agent's account.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
