            - { name: signing-key, mountPath: /idp-data/signing-key.pem, subPath: signing-key.pem, readOnly: true }
            - { name: tls, mountPath: /idp-data/tls, readOnly: true }
            - { name: admin-token, mountPath: /idp-data/secrets, readOnly: true }
