# Source: pragmatic-engine/templates/hive-agent-placer-clusterrole.yaml
# "Place, never look" (levels design §4, C3.4), as small as what the agent applies itself: it moves the engine's own
# workloads (component-at-version: their images; repair: a restart), by name, and nothing else. It reads nothing but those
# four workloads (by name: no list, no watch) and has no access to Secrets, ConfigMaps, pods (exec, port-forward, logs),
# services/proxy or nodes/proxy; its own Secret, ConfigMaps and Lease are its namespaced Role's (hive-agent-rbac.yaml).
# Environments are the console's (the agent forwards their intents). The admission policy fences even this
# (hive-agent-admission-policy.yaml: an image-only change to a managed object).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragmatic-hive-agent-placer
  labels:
    pragmatic/hive: acme-hive
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["pragmatic-tenant-admin-acme", "pragmatic-hive-acme-hive-agent", "pragmatic-idp-acme"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["pragmatic-postgres"]
    verbs: ["get", "patch", "update"]
---
# Source: pragmatic-engine/templates/hive-agent-rbac.yaml
# TokenReviews (the console's bearer), cluster-scoped. Nothing else is cluster-wide but the placer's four workloads by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragmatic-hive-agent-reporter
  labels:
    pragmatic/hive: acme-hive
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
# Source: pragmatic-engine/templates/tenant-admin-rbac.yaml
# The console's access, as the platform's console install grants it: it creates and deletes its own hive's environment
