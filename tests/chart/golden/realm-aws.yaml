            - { name: PRAGMATIC_IDP_TRUSTED_PROXY, value: "true" }
            - { name: PRAGMATIC_REALM_SECRETS_OPTION, value: "aws" }
            - { name: PRAGMATIC_REALM_SECRETS_REGION, value: "eu-west-1" }
            - { name: PRAGMATIC_REALM_SECRETS_ROLE_ARN, value: "arn:aws:iam::123456789012:role/acme-realm" }
            - { name: PRAGMATIC_REALM_ID, value: "acme" }
            - { name: PRAGMATIC_COMPONENT, value: "pragmatic-tenant-idp" }
            - { name: PRAGMATIC_WORKLOAD_TOKEN_FILE, value: /var/run/secrets/pragmatic/workload-identity/token }
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - { name: data, mountPath: /idp-data }
