          type: RuntimeDefault
      containers:
        - name: idp
          image: ghcr.io/pragmatic-tech-ai/pragmatic-tenant-idp@sha256:a4f2d051773e7162d061eeb10b5ac34048c4a380ff92792372194bc9f6f53a54
