# Source: pragmatic-engine/templates/hive-agent-deployment.yaml
# The hive agent (level connected): it generates the hive's key in the cluster, serves the console's internal enrolment
# API on 7210 (only the console's pods reach it: hive-agent-networkpolicy.yaml) and, once enrolled, reports over the signed
# agent channel (C3.3). Hosted hives (set by the host agent, C5.1) enrol themselves with the host agent's one-time code
# (Secret pragmatic-hive-enrolment-code), serve no internal API and bind it to cluster-admin; otherwise it gets the placer role
# (hive-agent-placer-clusterrole.yaml: place, never look) fenced by the admission policy (hive-agent-admission-policy.yaml),
# and the narrow Roles of hive-agent-rbac.yaml. Enrolled and Delegated agents apply pulled intents (C3.4): engine components
# themselves, environments through the console's internal endpoint on 7211 with a token for audience pragmatic-tenant-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragmatic-hive-acme-hive-agent
  namespace: pragmatic-system
  labels:
    pragmatic/hive: acme-hive
---
# Source: pragmatic-engine/templates/tenant-admin-deployment.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragmatic-tenant-admin-acme
  namespace: pragmatic-system
  labels:
    pragmatic/hive: acme-hive
automountServiceAccountToken: true
---
# Source: pragmatic-engine/templates/tenant-idp-deployment.yaml
# The realm sign-in service in its own namespace (the bootstrap created it with its Secrets). It keeps no data on a claim:
# its records live in the hive Postgres, its master and signing keys and its TLS in minted Secrets. Behind the ingress it
# trusts the controller's forwarded client address, so its per-address throttles see each client.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragmatic-idp-acme
  namespace: pragmatic-idp-acme
  labels:
    pragmatic/hive: acme-hive
automountServiceAccountToken: false
---
