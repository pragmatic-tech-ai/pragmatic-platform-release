# Source: pragmatic-engine/templates/hive-agent-rbac.yaml
# What the connected agent may do for its enrolment and reports (C3.3), and nothing more: create Secrets (its identity
# Secret, once) and read or update only pragmatic-hive-identity; read, create and update only the enrolment and kept-intents
# ConfigMaps (C3.4);
# read the engine's own workloads by name; create TokenReviews (the console's bearer on its internal API). Its report's
# environments come from the console (C3.4: no cluster-wide list). Never a read of any other Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pragmatic-hive-acme-hive-agent-enrolment
  namespace: pragmatic-system
  labels:
    pragmatic/hive: acme-hive
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pragmatic-hive-identity"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["pragmatic-hive-enrolment", "pragmatic-hive-intents"]
    verbs: ["get", "update"]
  # The intent lease (C3.4): one agent pod applies intents at a time.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["pragmatic-hive-agent-intents"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["pragmatic-tenant-admin-acme"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["pragmatic-postgres"]
    verbs: ["get"]
---
