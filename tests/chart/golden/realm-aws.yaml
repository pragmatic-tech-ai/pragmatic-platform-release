              containerPort: 7210
          env:
            - { name: PRAGMATIC_AGENT_REGISTRY_URL, value: "https://agent.pragmatic-tech.ai" }
            - { name: PRAGMATIC_AGENT_HIVE_ID, value: "acme-hive" }
            - { name: PRAGMATIC_AGENT_TENANT, value: "acme" }
            - { name: PRAGMATIC_AGENT_ENGINE_VERSION, value: "0.0.0" }
            - { name: PRAGMATIC_AGENT_TRUST_ROOT_FILE, value: /etc/pragmatic/agent-trust-root/platform.pub.pem }
            - { name: PRAGMATIC_AGENT_NAMESPACE, value: "pragmatic-system" }
            - { name: PRAGMATIC_AGENT_CONSOLE_SERVICE_ACCOUNT, value: "pragmatic-tenant-admin-acme" }
            - { name: PRAGMATIC_AGENT_CONSOLE_DEPLOYMENT, value: "pragmatic-tenant-admin-acme" }
            - { name: PRAGMATIC_AGENT_IDP_NAMESPACE, value: "pragmatic-idp-acme" }
            - { name: PRAGMATIC_AGENT_IDP_DEPLOYMENT, value: "pragmatic-idp-acme" }
            - { name: PRAGMATIC_AGENT_POSTGRES_STATEFULSET, value: pragmatic-postgres }
            # Pull-only management (C3.4): the console's intent endpoint, the agent's token for it, its own Deployment.
