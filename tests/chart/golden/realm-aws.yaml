          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/pragmatic-ready"]
            periodSeconds: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          volumeMounts:
            - { name: trust-root, mountPath: /etc/pragmatic/agent-trust-root, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: console-token, mountPath: /var/run/secrets/pragmatic-tenant-admin, readOnly: true }
            - name: cfg-hive-agent
              mountPath: /etc/pragmatic/configuration
              readOnly: true
            - name: cfgstore-hive-agent
              mountPath: /run/secrets/pragmatic/pragmatic-hive-agent
              readOnly: true
            - name: cfgrun-hive-agent
              mountPath: /run/pragmatic/secrets
      volumes:
        # The platform's trust root the agent pins at enrolment (public).
        - name: trust-root
          configMap: { name: pragmatic-hive-agent-trust-root, items: [{ key: platform.pub.pem, path: platform.pub.pem }] }
        - name: tmp
          emptyDir: {}
        # The agent's token for the console's internal intent endpoint only (audience pragmatic-tenant-admin, an hour, rotated).
        - name: console-token
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: pragmatic-tenant-admin
                  expirationSeconds: 3600
                  path: token
        - name: cfg-hive-agent
          configMap:
            name: pragmatic-config-pragmatic-hive-agent
            optional: true
        - name: cfgstore-hive-agent
          secret:
            secretName: pragmatic-secrets-pragmatic-hive-agent
            optional: true
            defaultMode: 288
        - name: cfgrun-hive-agent
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
