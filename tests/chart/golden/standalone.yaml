  pragmatic-hive-agent.json: "{\"component\":\"pragmatic-hive-agent\",\"schema\":1}"
  pragmatic-platform-admin.json: "{\"component\":\"pragmatic-platform-admin\",\"schema\":1}"
  pragmatic-platform-edge.json: "{\"component\":\"pragmatic-platform-edge\",\"schema\":1}"
  pragmatic-postgres.json: "{\"component\":\"pragmatic-postgres\",\"schema\":1}"
  pragmatic-tenant-admin.json: "{\"component\":\"pragmatic-tenant-admin\",\"schema\":1}"
  pragmatic-tenant-idp.json: "{\"component\":\"pragmatic-tenant-idp\",\"schema\":1}"
  pragmatic-ui-unpack.json: "{\"component\":\"pragmatic-ui-unpack\",\"schema\":1}"
---
# Source: pragmatic-engine/templates/postgres-applications-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pragmatic-postgres-applications
  namespace: pragmatic-system
  labels:
    pragmatic/hive: acme-hive
data:
  # <application> <database> <role>: the image's reconcile creates each at start (an environment's database is the
