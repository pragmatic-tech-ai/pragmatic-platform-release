# Source: pragmatic-engine/templates/tenant-admin-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pragmatic-tenant-admin-acme
  namespace: pragmatic-system
  labels:
    pragmatic/hive: acme-hive
    pragmatic/app: pragmatic-tenant-admin-acme
    app.kubernetes.io/component: pragmatic-tenant-admin
    app.kubernetes.io/managed-by: pragmatic-tenant-admin
    component.pragmatic-tech.ai/pragmatic-tenant-admin: tenant-admin
spec:
  replicas: 1
  # Recreate: one pod on a ReadWriteOnce data claim (a surge would start the new pod before the old one lets it go).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      pragmatic/app: pragmatic-tenant-admin-acme
  template:
    metadata:
      labels:
        pragmatic/app: pragmatic-tenant-admin-acme
        app.kubernetes.io/component: pragmatic-tenant-admin
        app.kubernetes.io/managed-by: pragmatic-tenant-admin
        component.pragmatic-tech.ai/pragmatic-tenant-admin: tenant-admin
    spec:
      serviceAccountName: pragmatic-tenant-admin-acme
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The directory seed, the master key and the release's image allow-list into the data folder.
        - name: seed
          image: ghcr.io/pragmatic-tech-ai/pragmatic-tenant-admin@sha256:7b2c2735355720d63b9f1b6f3ce21603521b78ea68fdada9694ba67e1c1fc63a
          command: ["sh", "-c", "cp -f --no-preserve=mode /seed/* /data/"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: tenant-admin
          image: ghcr.io/pragmatic-tech-ai/pragmatic-tenant-admin@sha256:7b2c2735355720d63b9f1b6f3ce21603521b78ea68fdada9694ba67e1c1fc63a
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: http
              containerPort: 7100
          env:
            - { name: PRAGMATIC_TENANT_ADMIN_DATA_ROOT, value: /data }
            - { name: PRAGMATIC_TENANT_ADMIN_PORT, value: "7100" }
            - { name: PRAGMATIC_TENANT_ADMIN_BIND, value: 0.0.0.0 }
            - { name: PRAGMATIC_TENANT_ADMIN_BASE_DOMAIN, value: "acme.example" }
            - { name: PRAGMATIC_TENANT_ADMIN_EXTERNAL_SCHEME, value: https }
            - { name: PRAGMATIC_TENANT_ADMIN_SECURE_COOKIE, value: "true" }
            - { name: PRAGMATIC_TENANT_ADMIN_TRUSTED_PROXY, value: "true" }
            - { name: PRAGMATIC_TENANT_ADMIN_DEPLOYMENT, value: "pragmatic-tenant-admin-acme" }
            - { name: PRAGMATIC_TENANT_ADMIN_CONSOLE_HOST, value: "console.acme.example" }
            - { name: PRAGMATIC_IDP_BROWSER_BASE_URL, value: "https://idp-acme.acme.example" }
            - { name: PRAGMATIC_IDP_BASE_URL, value: "https://pragmatic-idp-acme.pragmatic-idp-acme.svc.cluster.local:9443" }
            - { name: PRAGMATIC_IDP_CA_FILE, value: /idp/ca/ca.crt }
            - { name: PRAGMATIC_IDP_ADMIN_TOKEN_FILE, value: /idp/token/admin-token }
            - { name: PRAGMATIC_TENANT_ADMIN_INGRESS_TLS_SOURCE, value: existing-secret }
            - { name: PRAGMATIC_TENANT_ADMIN_INGRESS_TLS_SECRET, value: "pragmatic-console-tls" }
            - { name: PRAGMATIC_TENANT_ADMIN_INGRESS_CLASS, value: "" }
            - { name: PRAGMATIC_TENANT_ADMIN_RELEASE_KEYS_DIR, value: /etc/pragmatic/release-keys }
            - { name: PRAGMATIC_TENANT_ADMIN_FINGERPRINT_KEY_FILE, value: /fingerprint/fingerprint.key }
            - { name: PRAGMATIC_TENANT_ADMIN_DATABASE_URL_FILE, value: /run/secrets/tenant-admin-database/database-url }
            - { name: PRAGMATIC_ENGINE_MODE, value: "standalone" }
            - { name: PRAGMATIC_TENANT_ADMIN_HIVE_POSTGRES_URL_FILE, value: /run/secrets/hive-postgres/database-url }
            - { name: PRAGMATIC_TENANT_ADMIN_ENV_SERVER_IMAGE, value: "ghcr.io/pragmatic-tech-ai/pragmatic-env-server@sha256:c147bbacbef86760ca19c158833956667ebdfa0f15cf1c9878a708468d83674a" }
            - { name: PRAGMATIC_TENANT_ADMIN_UI_UNPACK_IMAGE, value: "ghcr.io/pragmatic-tech-ai/pragmatic-ui-unpack@sha256:fd41dd9614e31684498e612ed865f78167f20c88668943da238aa10109e06cf6" }
            - { name: PRAGMATIC_TENANT_ADMIN_OWNER_INITIAL_DIR, value: /run/secrets/pragmatic-owner-initial }
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 1536Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: idp-ca, mountPath: /idp/ca, readOnly: true }
            - { name: idp-token, mountPath: /idp/token, readOnly: true }
            - { name: fingerprint, mountPath: /fingerprint, readOnly: true }
            - { name: database-url, mountPath: /run/secrets/tenant-admin-database, readOnly: true }
            - { name: hive-postgres, mountPath: /run/secrets/hive-postgres, readOnly: true }
            - { name: owner-initial, mountPath: /run/secrets/pragmatic-owner-initial, readOnly: true }
            - { name: release-descriptors, mountPath: /etc/pragmatic/descriptors, readOnly: true }
            - { name: release-keys, mountPath: /etc/pragmatic/release-keys, readOnly: true }
            - name: cfg-tenant-admin
              mountPath: /etc/pragmatic/configuration
              readOnly: true
            - name: cfgstore-tenant-admin
              mountPath: /run/secrets/pragmatic/pragmatic-tenant-admin
              readOnly: true
            - name: cfgrun-tenant-admin
              mountPath: /run/pragmatic/secrets
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pragmatic-tenant-admin-acme-data
        - name: tmp
          emptyDir: {}
        - name: seed
          projected:
            defaultMode: 288
            sources:
              - secret:
                  name: pragmatic-tenant-admin-seed
                  items: [{ key: seed.json, path: seed.json }]
              - secret:
                  name: pragmatic-tenant-admin-master-key
                  items: [{ key: master.key, path: master.key }]
              - configMap:
                  name: pragmatic-engine-release
                  items: [{ key: verified-images.json, path: verified-images.json }]
        # Only the public CA certificate of the sign-in service, never its key.
        - name: idp-ca
          secret: { secretName: pragmatic-tenant-idp-ca, defaultMode: 288, items: [{ key: ca.crt, path: ca.crt }] }
        - name: idp-token
          secret: { secretName: pragmatic-tenant-idp-admin-token, defaultMode: 288, items: [{ key: admin-token, path: admin-token }] }
        - name: fingerprint
          secret: { secretName: pragmatic-tenant-admin-fingerprint, defaultMode: 288, items: [{ key: fingerprint.key, path: fingerprint.key }] }
        - name: database-url
          secret: { secretName: pragmatic-postgres-app-tenant-admin, defaultMode: 288, items: [{ key: database-url, path: database-url }] }
        - name: hive-postgres
          secret: { secretName: pragmatic-postgres-superuser, defaultMode: 288, items: [{ key: database-url, path: database-url }] }
        - name: owner-initial
          secret: { secretName: pragmatic-owner-initial, defaultMode: 288, items: [{ key: email, path: email }, { key: password, path: password }] }
        - name: release-descriptors
          configMap: { name: pragmatic-engine-descriptors }
        - name: release-keys
          configMap: { name: pragmatic-engine-release-keys }
        - name: cfg-tenant-admin
          configMap:
            name: pragmatic-config-pragmatic-tenant-admin
            optional: true
        - name: cfgstore-tenant-admin
          secret:
            secretName: pragmatic-secrets-pragmatic-tenant-admin
            optional: true
            defaultMode: 288
        - name: cfgrun-tenant-admin
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
---
# Source: pragmatic-engine/templates/tenant-idp-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pragmatic-idp-acme
  namespace: pragmatic-idp-acme
  labels:
    pragmatic/hive: acme-hive
    pragmatic/app: pragmatic-idp-acme
    app.kubernetes.io/component: pragmatic-tenant-idp
    app.kubernetes.io/managed-by: pragmatic-tenant-admin
    component.pragmatic-tech.ai/pragmatic-tenant-idp: idp
spec:
  replicas: 1
  # No claim: a surge roll keeps the sign-in service up while it updates.
  strategy:
    type: RollingUpdate
