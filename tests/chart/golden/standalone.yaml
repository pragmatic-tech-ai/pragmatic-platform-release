# Source: pragmatic-engine/templates/tenant-idp-deployment.yaml
# The realm sign-in service in its own namespace (the bootstrap created it with its Secrets). It keeps no data on a claim:
# its records live in the hive Postgres, its master and signing keys and its TLS in minted Secrets. Behind the ingress it
# trusts the controller's forwarded client address, so its per-address throttles see each client.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragmatic-idp-acme
  namespace: pragmatic-idp-acme
  labels:
    pragmatic/hive: acme-hive
automountServiceAccountToken: false
---
