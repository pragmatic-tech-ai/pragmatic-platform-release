# The pragmatic-engine chart's values. None is a secret: every engine secret is minted inside the cluster by the
# bootstrap hook Job (read the Owner's one-time password with `kubectl get secret pragmatic-owner-initial`).
#
#   helm install pragmatic-engine oci://ghcr.io/pragmatic-tech-ai/charts/pragmatic-engine --version <release> \
#     --namespace pragmatic-system --create-namespace --set tenant.id=<tenant> --set console.host=<host>

# connected: the hive agent is installed, idle until the hive is enrolled. standalone: no agent, no dial-home.
level: connected
# Set only by the platform's host agent (Hosted hives): binds the agent to cluster-admin.
hosted: false

tenant:
  # Required. The realm id of the sign-in service from the first start (enrolment never renames it).
  id: ""
  # Display name of the tenant; defaults to tenant.id.
  name: ""

hive:
  # Defaults to <tenant.id>-hive.
  id: ""
  name: ""

owner:
  # The Owner's sign-in email; defaults to owner@<console.baseDomain>.
  email: ""

console:
  # Required. The console's host name.
  host: ""
  # own-domain (you publish DNS), hive-subdomain or relayed-hive-subdomain (published by the platform at enrolment).
  address: own-domain
  # The domain the realm sign-in service (idp-<tenant>.<baseDomain>) and the environments (<env>.<baseDomain>) are
  # published under; defaults to console.host without its first label.
  baseDomain: ""
  # The HTTPS port browsers reach the ingress on.
  port: 443
  # The console's data claim (its working folder; records live in Postgres).
  dataSize: 1Gi

tls:
  # secret: tls.secretName names a kubernetes.io/tls Secret in the install namespace covering the console, the sign-in
  # service and *.<baseDomain>. self-signed: the bootstrap mints a development CA (Secret pragmatic-tls-dev-ca).
  mode: secret
  secretName: ""

ingress:
  # Empty: the cluster's default IngressClass.
  className: ""
  # The ingress controller's namespace: the only one that may reach the console's port.
  namespace: ingress-nginx

storage:
  # Empty: the cluster's default StorageClass.
  className: ""

postgres:
  size: 10Gi

# The public key the console verifies signed releases against (default: the published release key), by its key id.
trustRoot:
  keyId: release-2026-11
  publicKey: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEAt4UFSruS/uj5bU6i9fQtc+mSG/4sqYXjPHGQgOMrock=
    -----END PUBLIC KEY-----

images:
  # A mirror may replace the registry. The repositories and digests are the release's, baked into the chart
  # (files/images.json, written by tools/chart-build.ts): no value can change them.
  registry: ghcr.io

agent:
  # The platform's agent channel (level connected only).
  channelUrl: https://agent.pragmatic-tech.ai

preflight:
  enabled: true

# Where the realm's secrets live (every component resolves secret:realm/<name> there). custom: an encrypted store in this
# hive's pragmatic-postgres (database realm_secrets, sealed under the minted pragmatic-realm-master-key). gcp, azure, aws:
# the cloud's secrets service, reached by workload identity only (each component's projected service-account token);
# set the option's identifiers below, never a key (the schema refuses one). No platform webhook annotation is rendered: the
# components exchange their own token with these identifiers. Runbook: customer-cluster.md, workload identity.
realmSecrets:
  option: custom
  gcp:
    projectId: ""
    # //iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
    workloadIdentityAudience: ""
    # Optional: a Google service account the components impersonate (else the pool principals hold the roles).
    serviceAccountEmail: ""
    # Optional: user-managed replication location for new secrets (else automatic).
    replicaLocation: ""
  azure:
    tenantId: ""
    clientId: ""
    vaultUrl: ""
    # Optional: another Entra authority (sovereign clouds).
    authorityHost: ""
  aws:
    region: ""
    roleArn: ""
    sessionName: ""

resources:
  console: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1536Mi } }
  idp: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
  agent: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
  postgres: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
  job: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
