{{- $ns := include "engine.namespace" . }}
# The public key the console verifies signed releases against (its release-keys folder: <key id>.pub.pem).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pragmatic-engine-release-keys
  namespace: {{ $ns }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
data:
  {{ .Values.trustRoot.keyId }}.pub.pem: {{ .Values.trustRoot.publicKey | quote }}
---
# The release's images the console may run in its environments (PinnedImageVerifier's allow-list), by digest: the
# environment server and the UI unpacker only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pragmatic-engine-release
  namespace: {{ $ns }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
data:
  {{- $images := list }}
  {{- range $app := list "pragmatic-env-server" "pragmatic-ui-unpack" }}
  {{- $images = append $images (dict "imageRef" (include "engine.image" (dict "root" $ "app" $app))) }}
  {{- end }}
  verified-images.json: {{ toJson $images | quote }}
  release: {{ .Chart.Version | quote }}
