{{- if and (not (include "engine.standalone" .)) (not .Values.hosted) }}
# "Place, never look" (levels design §4, C3.4): what an Enrolled or Delegated agent may do to apply pulled intents (an
# Enrolled hive applies them too, after the customer's approval). It may create, change and delete the objects that place
# workloads, and read only Deployments, StatefulSets and Namespaces (to see what it rolled). It may create, patch and
# delete Secrets but never get, list or watch one; nothing on pods (exec, port-forward, logs), services/proxy or
# nodes/proxy. Where it may do it is fenced by the admission policy (hive-agent-admission-policy.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragmatic-hive-agent-placer
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
{{- end }}
