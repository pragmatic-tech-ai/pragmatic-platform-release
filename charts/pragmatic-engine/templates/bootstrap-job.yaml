{{- $ns := include "engine.namespace" . }}
{{- $idpNs := include "engine.idpName" . }}
{{- $tls := include "engine.consoleTlsSecret" . }}
{{- $image := include "engine.image" (dict "root" . "app" "pragmatic-tenant-admin") }}
# Bootstrap (pre-install, pre-upgrade; after the preflight), in two steps with the console image. First the realm sign-in
# service's namespace (its account may create namespaces and read only that one). Then, under Roles bound in the engine's
# two namespaces only, every absent engine Secret is minted inside the cluster (never replacing one), so this chart's
# values stay secret-free. No account here may read a Secret outside those two namespaces or by another name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragmatic-engine-namespace
  namespace: {{ $ns }}
  annotations:
    {{- include "engine.hookObject" (dict "weight" -19) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragmatic-engine-namespace
  annotations:
    {{- include "engine.hookObject" (dict "weight" -19) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ $idpNs | quote }}]
    verbs: ["get"]
  # The engine's two namespaces enforce the restricted Pod Security level (enforce and enforce-version labels).
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ $idpNs | quote }}, {{ include "engine.namespace" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pragmatic-engine-namespace
  annotations:
    {{- include "engine.hookObject" (dict "weight" -19) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pragmatic-engine-namespace
subjects:
  - kind: ServiceAccount
    name: pragmatic-engine-namespace
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pragmatic-engine-namespace
  namespace: {{ $ns }}
  annotations:
    {{- include "engine.hookJob" (dict "weight" -18) | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pragmatic-engine-namespace
    spec:
      serviceAccountName: pragmatic-engine-namespace
      restartPolicy: Never
      securityContext:
        {{- include "engine.podSecurity" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: namespace
          image: {{ $image }}
          command: ["node", "dist/bin/pragmatic-tenant-admind.js", "bootstrap", "namespace"]
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            {{- include "engine.bootstrapEnv" . | nindent 12 }}
          securityContext:
            {{- include "engine.containerSecurity" (dict "uid" 10001) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.job | nindent 12 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragmatic-engine-bootstrap
  namespace: {{ $ns }}
  annotations:
    {{- include "engine.hookObject" (dict "weight" -15) | nindent 4 }}
---
# The bootstrap reads only that the sign-in service's namespace exists (the namespace step made it).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragmatic-engine-bootstrap
  annotations:
    {{- include "engine.hookObject" (dict "weight" -15) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ $idpNs | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pragmatic-engine-bootstrap
  annotations:
    {{- include "engine.hookObject" (dict "weight" -15) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pragmatic-engine-bootstrap
subjects:
  - kind: ServiceAccount
    name: pragmatic-engine-bootstrap
    namespace: {{ $ns }}
{{- range $at := list $ns $idpNs }}
---
# In {{ $at }}: create Secrets and the configuration objects; read and update only the engine's own Secrets, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pragmatic-engine-bootstrap
  namespace: {{ $at }}
  annotations:
    {{- include "engine.hookObject" (dict "weight" -15) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- if eq $at $ns }}
      - pragmatic-postgres-superuser
      - pragmatic-postgres-app-tenant-admin
      - pragmatic-postgres-app-tenant-idp
      - pragmatic-tenant-admin-master-key
      - pragmatic-tenant-admin-fingerprint
      - pragmatic-tenant-admin-seed
      - pragmatic-tenant-idp-admin-token
      - pragmatic-owner-initial
      - pragmatic-tenant-idp-ca
      - pragmatic-tls-dev-ca
      - pragmatic-realm-master-key
      - pragmatic-postgres-realm-secrets-console
      - pragmatic-postgres-realm-secrets-idp
      - pragmatic-postgres-realm-secrets-environments
      {{- else }}
      - pragmatic-tenant-idp-master-key
      - pragmatic-tenant-idp-signing-key
      - pragmatic-tenant-idp-tls
      - pragmatic-tenant-idp-admin-token
      - pragmatic-tenant-idp-database
      - pragmatic-realm-master-key
      - pragmatic-tenant-idp-realm-secrets
      {{- end }}
      - {{ $tls | quote }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pragmatic-engine-bootstrap
  namespace: {{ $at }}
  annotations:
    {{- include "engine.hookObject" (dict "weight" -15) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pragmatic-engine-bootstrap
subjects:
  - kind: ServiceAccount
    name: pragmatic-engine-bootstrap
    namespace: {{ $ns }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pragmatic-engine-bootstrap
  namespace: {{ $ns }}
  annotations:
    {{- include "engine.hookJob" (dict "weight" -10) | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pragmatic-engine-bootstrap
    spec:
      serviceAccountName: pragmatic-engine-bootstrap
      restartPolicy: Never
      securityContext:
        {{- include "engine.podSecurity" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ $image }}
          command: ["node", "dist/bin/pragmatic-tenant-admind.js", "bootstrap"]
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            {{- include "engine.bootstrapEnv" . | nindent 12 }}
          securityContext:
            {{- include "engine.containerSecurity" (dict "uid" 10001) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources.job | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
