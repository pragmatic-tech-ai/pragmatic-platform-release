{{- if and (not (include "engine.standalone" .)) (not .Values.hosted) }}
{{- $ns := include "engine.namespace" . }}
{{- $name := include "engine.agentName" . }}
{{- $idp := include "engine.idpName" . }}
# What the connected agent may do for its enrolment and reports (C3.3), and nothing more: create Secrets (its identity
# Secret, once) and read or update only pragmatic-hive-identity; read, create and update only the enrolment and kept-intents
# ConfigMaps (C3.4);
# read the engine's own workloads; create TokenReviews (the console's bearer on its internal API); list Deployments for
# the environments it reports. Never a read of any other Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-enrolment
  namespace: {{ $ns }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pragmatic-hive-identity"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["pragmatic-hive-enrolment", "pragmatic-hive-intents"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "engine.consoleName" . | quote }}]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["pragmatic-postgres"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-enrolment
  namespace: {{ $ns }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-enrolment
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
# The sign-in service's Deployment, for the agent's reports (in the sign-in service's namespace, pragmatic-idp-<tenant>).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-report
  namespace: {{ $idp }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $idp | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-report
  namespace: {{ $idp }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-report
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
---
# TokenReviews (the console's bearer) and the environments' Deployments (read-only), cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragmatic-hive-agent-reporter
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-reporter
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pragmatic-hive-agent-reporter
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns }}
{{- end }}
