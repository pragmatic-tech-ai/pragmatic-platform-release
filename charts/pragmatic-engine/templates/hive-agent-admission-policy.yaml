{{- if and (not (include "engine.standalone" .)) (not .Values.hosted) }}
{{- $ns := include "engine.namespace" . }}
{{- $name := include "engine.agentName" . }}
{{- $idp := include "engine.idpName" . }}
# The hive agent's admission fence (C3.4, "place, never look", enforced in the cluster): every change the agent's
# service account makes must be in the engine's namespaces (this one, the sign-in service's) or an environment's
# (pragmatic-env-*), to an object the agent, the console or the chart manages (app.kubernetes.io/managed-by), and every
# container image of a Deployment or StatefulSet must be a release image by digest (ghcr.io or registry.pragmatic-tech.ai,
# organisation pragmatic-tech-ai). Kubernetes ValidatingAdmissionPolicy (GA in 1.30): nothing to run or certify.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConditions:
    - name: hive-agent-service-account
      expression: "request.userInfo.username == 'system:serviceaccount:{{ $ns }}:{{ $name }}'"
  matchConstraints:
    resourceRules:
      - { apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["namespaces", "services", "configmaps", "serviceaccounts", "persistentvolumeclaims", "secrets"], scope: "*" }
      - { apiGroups: ["apps"], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["deployments", "statefulsets"], scope: "*" }
      - { apiGroups: ["networking.k8s.io"], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["ingresses", "networkpolicies"], scope: "*" }
  variables:
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: namespace
      expression: "request.resource.resource == 'namespaces' ? variables.target.metadata.name : request.namespace"
  validations:
    - expression: >-
        variables.namespace in ['{{ $ns }}', '{{ $idp }}'] || variables.namespace.startsWith('pragmatic-env-')
      message: "The hive agent may only change objects in the engine's namespaces and its environments' (pragmatic-env-*)."
    - expression: >-
        has(variables.target.metadata.labels) && 'app.kubernetes.io/managed-by' in variables.target.metadata.labels
        && variables.target.metadata.labels['app.kubernetes.io/managed-by'] in ['pragmatic-hive-agent', 'pragmatic-tenant-admin', 'pragmatic-engine']
      message: "The hive agent may only change objects the agent, the console or the engine chart manages."
    - expression: >-
        request.operation == 'DELETE' || !(request.resource.resource in ['deployments', 'statefulsets'])
        || (object.spec.template.spec.containers.all(c, c.image.matches(r'^(ghcr\.io|registry\.pragmatic-tech\.ai)/pragmatic-tech-ai/[^@]+@sha256:[a-f0-9]{64}$'))
        && (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, c.image.matches(r'^(ghcr\.io|registry\.pragmatic-tech\.ai)/pragmatic-tech-ai/[^@]+@sha256:[a-f0-9]{64}$'))))
      message: "The hive agent may only run release images by digest (ghcr.io or registry.pragmatic-tech.ai, pragmatic-tech-ai)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: ["Deny"]
{{- end }}
