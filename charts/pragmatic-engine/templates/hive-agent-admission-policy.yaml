{{- if and (not (include "engine.standalone" .)) (not .Values.hosted) }}
{{- $ns := include "engine.namespace" . }}
{{- $name := include "engine.agentName" . }}
{{- $idp := include "engine.idpName" . }}
{{- $console := include "engine.consoleName" . }}
{{- $podFields := list "volumes" "serviceAccountName" "serviceAccount" "automountServiceAccountToken" "hostNetwork" "hostPID" "hostIPC" "hostUsers" "securityContext" "nodeName" "nodeSelector" "hostAliases" "shareProcessNamespace" "runtimeClassName" "dnsPolicy" "dnsConfig" "affinity" "tolerations" "priorityClassName" "enableServiceLinks" "imagePullSecrets" "overhead" "os" "schedulingGates" "resourceClaims" "readinessGates" "subdomain" "hostname" "setHostnameAsFQDN" "preemptionPolicy" "topologySpreadConstraints" "terminationGracePeriodSeconds" "activeDeadlineSeconds" "restartPolicy" "schedulerName" }}
{{- $containerFields := list "command" "args" "workingDir" "ports" "envFrom" "env" "resources" "resizePolicy" "volumeMounts" "volumeDevices" "livenessProbe" "readinessProbe" "startupProbe" "lifecycle" "securityContext" "stdin" "stdinOnce" "tty" "imagePullPolicy" "terminationMessagePath" "terminationMessagePolicy" "restartPolicy" }}
# The hive agent's admission fence (C3.4, "place, never look", enforced in the cluster, not promised), on the agent's
# service account only. It may change exactly two kinds of object:
#   - its own Secret, ConfigMaps and Lease in this namespace (by name, labelled managed-by pragmatic-hive-agent);
#   - the engine's four workloads (by name, in this namespace and the sign-in service's), UPDATE only, both before and after
#     managed by the agent, the console or the chart, with every container and init container a release image by digest
#     (ghcr.io or registry.pragmatic-tech.ai, organisation pragmatic-tech-ai), and nothing but the images changed: the pod
#     spec's other fields and each container's other fields (command, args, env, envFrom, volumes and mounts, the service
#     account, security contexts, probes) equal the object's before, no hostPath, privileged, host namespaces or added
#     capabilities. So it can never "look by placing": no new workload, no shell, no other Secret mounted, no other account.
# Every other change (namespaces included: the agent never touches one; environments are the console's) is denied.
# Kubernetes ValidatingAdmissionPolicy (GA in 1.30): nothing to run or certify.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConditions:
    - name: hive-agent-service-account
      expression: "request.userInfo.username == 'system:serviceaccount:{{ $ns }}:{{ $name }}'"
  matchConstraints:
    resourceRules:
      - { apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["namespaces", "secrets", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims", "pods"], scope: "*" }
      - { apiGroups: ["apps"], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["deployments", "statefulsets", "daemonsets", "replicasets"], scope: "*" }
      - { apiGroups: ["batch"], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["jobs", "cronjobs"], scope: "*" }
      - { apiGroups: ["networking.k8s.io"], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["ingresses", "networkpolicies"], scope: "*" }
      - { apiGroups: ["coordination.k8s.io"], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["leases"], scope: "*" }
      - { apiGroups: ["rbac.authorization.k8s.io"], apiVersions: ["v1"], operations: ["CREATE", "UPDATE", "DELETE"], resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"], scope: "*" }
  variables:
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: own
      expression: >-
        request.namespace == '{{ $ns }}' && request.resource.resource in ['secrets', 'configmaps', 'leases']
        && variables.target.metadata.name in ['pragmatic-hive-identity', 'pragmatic-hive-enrolment', 'pragmatic-hive-intents', 'pragmatic-hive-agent-intents']
    - name: workload
      expression: >-
        request.resource.group == 'apps' && ((request.resource.resource == 'deployments' && ((request.namespace == '{{ $ns }}' && variables.target.metadata.name in ['{{ $console }}', '{{ $name }}'])
        || (request.namespace == '{{ $idp }}' && variables.target.metadata.name == '{{ $idp }}')))
        || (request.resource.resource == 'statefulsets' && request.namespace == '{{ $ns }}' && variables.target.metadata.name == 'pragmatic-postgres'))
  validations:
    - expression: "variables.own || variables.workload"
      message: "The hive agent may only change its own Secret, ConfigMaps and Lease, and the engine's own workloads."
    - expression: >-
        !variables.own || (request.operation != 'DELETE' && has(object.metadata.labels) && 'app.kubernetes.io/managed-by' in object.metadata.labels
        && object.metadata.labels['app.kubernetes.io/managed-by'] == 'pragmatic-hive-agent')
      message: "The hive agent's own objects carry managed-by pragmatic-hive-agent and are never deleted by it."
    - expression: "!variables.workload || request.operation == 'UPDATE'"
      message: "The hive agent never creates or deletes a workload: it only moves the engine's own."
    - expression: >-
        !variables.workload || request.operation != 'UPDATE' || ({{ include "engine.celManaged" "oldObject" }} && {{ include "engine.celManaged" "object" }})
      message: "The hive agent may only change workloads the agent, the console or the engine chart managed before and after."
    - expression: >-
        !variables.workload || request.operation != 'UPDATE' || (object.spec.template.spec.containers.all(c, c.image.matches({{ include "engine.celReleaseImage" . }}))
        && (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, c.image.matches({{ include "engine.celReleaseImage" . }}))))
      message: "The hive agent may only run release images by digest (ghcr.io or registry.pragmatic-tech.ai, pragmatic-tech-ai)."
    - expression: >-
        !variables.workload || request.operation != 'UPDATE' || ({{- range $i, $f := $podFields }}{{ if $i }} && {{ end }}{{ include "engine.celSame" (dict "a" "object.spec.template.spec" "b" "oldObject.spec.template.spec" "f" $f) }}{{- end }})
      message: "The hive agent may only change a workload's images: its pod's volumes, service account and security stay as they were."
    {{- range $list := list "containers" "initContainers" }}
    - expression: >-
        !variables.workload || request.operation != 'UPDATE' || (has(object.spec.template.spec.{{ $list }}) == has(oldObject.spec.template.spec.{{ $list }})
        && (!has(object.spec.template.spec.{{ $list }}) || (size(object.spec.template.spec.{{ $list }}) == size(oldObject.spec.template.spec.{{ $list }})
        && object.spec.template.spec.{{ $list }}.all(c, oldObject.spec.template.spec.{{ $list }}.exists(o, o.name == c.name{{- range $f := $containerFields }} && {{ include "engine.celSame" (dict "a" "c" "b" "o" "f" $f) }}{{- end }})))))
      message: "The hive agent may only change a container's image: its command, arguments, environment, mounts and security stay as they were."
    {{- end }}
    - expression: >-
        !variables.workload || request.operation != 'UPDATE' || ((!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v, !has(v.hostPath)))
        && (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork)
        && (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID)
        && (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC)
        && object.spec.template.spec.containers.all(c, {{ include "engine.celUnprivileged" "c" }})
        && (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, {{ include "engine.celUnprivileged" "c" }})))
      message: "The hive agent may never run a workload with hostPath, host namespaces, privileged containers or added capabilities."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "engine.hiveLabels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: ["Deny"]
{{- end }}
