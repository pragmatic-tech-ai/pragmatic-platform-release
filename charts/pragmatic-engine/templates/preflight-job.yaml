{{- if .Values.preflight.enabled }}
{{- $ns := include "engine.namespace" . }}
# Preflight (pre-install, pre-upgrade; before anything else): the hive agent image checks the cluster version, the storage
# and ingress classes, the published names and the certificate. A failing check fails this Job and Helm stops before any
# workload is created; read why with: kubectl logs -n {{ $ns }} job/pragmatic-engine-preflight
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragmatic-engine-preflight
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragmatic-engine-preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["list"]
  - nonResourceURLs: ["/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pragmatic-engine-preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pragmatic-engine-preflight
subjects:
  - kind: ServiceAccount
    name: pragmatic-engine-preflight
    namespace: {{ $ns }}
{{- if not (include "engine.selfSigned" .) }}
---
# Reads only the operator's TLS Secret (its certificate's names and validity).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pragmatic-engine-preflight
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "engine.consoleTlsSecret" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pragmatic-engine-preflight
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pragmatic-engine-preflight
subjects:
  - kind: ServiceAccount
    name: pragmatic-engine-preflight
    namespace: {{ $ns }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pragmatic-engine-preflight
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    # A failed preflight Job stays (its log says why); the next install replaces it.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pragmatic-engine-preflight
    spec:
      serviceAccountName: pragmatic-engine-preflight
      restartPolicy: Never
      securityContext:
        {{- include "engine.podSecurity" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: preflight
          image: {{ include "engine.image" (dict "root" . "app" "pragmatic-hive-agent") }}
          args: ["preflight"]
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: PRAGMATIC_PREFLIGHT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PRAGMATIC_PREFLIGHT_STORAGE_CLASS
              value: {{ .Values.storage.className | quote }}
            - name: PRAGMATIC_PREFLIGHT_INGRESS_CLASS
              value: {{ .Values.ingress.className | quote }}
            - name: PRAGMATIC_PREFLIGHT_CONSOLE_HOST
              value: {{ .Values.console.host | quote }}
            - name: PRAGMATIC_PREFLIGHT_IDP_HOST
              value: {{ include "engine.idpHost" . | quote }}
            - name: PRAGMATIC_PREFLIGHT_CONSOLE_ADDRESS
              value: {{ .Values.console.address | quote }}
            - name: PRAGMATIC_PREFLIGHT_TLS_MODE
              value: {{ .Values.tls.mode | quote }}
            - name: PRAGMATIC_PREFLIGHT_TLS_SECRET
              value: {{ if include "engine.selfSigned" . }}""{{ else }}{{ include "engine.consoleTlsSecret" . | quote }}{{ end }}
          securityContext:
            {{- include "engine.containerSecurity" (dict "uid" 10001) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.job | nindent 12 }}
{{- end }}
